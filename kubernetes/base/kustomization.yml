apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app-deployment.yml
  - app-service.yml
  - keycloak-deployment.yml
  - keycloak-service.yml
  - post-deployment.yml
  - post-pvc.yml
  - post-service.yml
  - postgres-config.yml
  - postgres-secret.yml
  - keycloak-secret.yml

configMapGenerator:
  - name: postgres-init
    files:
      - files/01-inicio.sql
      - files/02-datos.sql

  - name: keycloak-realm
    files:
      - realm-export.json=files/realm-export.json