services:
  postgres_db:
    image: postgres:17  
    container_name: servicioComida-Postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/inicio.sql:/docker-entrypoint-initdb.d/inicio.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: servicioComida-Keycloak
    # MODIFICADO: Agregamos --import-realm al final
    command: start-dev --health-enabled=true --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    # NUEVO: Montamos el archivo JSON generado en la ruta de importación de Keycloak
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kcadm.sh", "config", "credentials", "--server", "http://localhost:8080", "--realm", "master", "--user", "${KEYCLOAK_ADMIN_USER}", "--password", "${KEYCLOAK_ADMIN_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s


  app:
    build: .
    container_name: servicioComida-App

    environment:
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

    ports:
      - "${APP_HOST_PORT}:${APP_CONTAINER_PORT}"

    depends_on:
      postgres_db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_CONTAINER_PORT}/health"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
