services:
  postgres_db:
    image: postgres:17  
    container_name: servicioComida-Postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s


  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: servicioComida-Keycloak
    command: start-dev --health-enabled=true --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_HOST_PORT}:${KEYCLOAK_CONTAINER_PORT}"
    # Montamos el archivo JSON generado en la ruta de importación de Keycloak
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kcadm.sh", "config", "credentials", "--server", "http://localhost:8080", "--realm", "master", "--user", "${KEYCLOAK_ADMIN_USER}", "--password", "${KEYCLOAK_ADMIN_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s


  app:
    build: .
    container_name: servicioComida-App

    environment:
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

    ports:
      - "${APP_HOST_PORT}:${APP_CONTAINER_PORT}"

    depends_on:
      postgres_db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 5s
      timeout: 5s
      retries: 3


  monitor:
    image: alpine:latest
    container_name: servicioComida-Monitor
    # Montamos el socket de Docker para que este contenedor pueda leer la salud de los demás
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Espera a que la App y sus dependencias terminen de arrancar para mostrar el reporte de salud
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl docker-cli > /dev/null 2>&1;
      
      until [ \$(docker inspect --format='{{.State.Health.Status}}' servicioComida-Postgres) = 'healthy' ]; do sleep 1; done;
      until [ \$(docker inspect --format='{{.State.Health.Status}}' servicioComida-Keycloak) = 'healthy' ]; do sleep 1; done;
      until [ \$(docker inspect --format='{{.State.Health.Status}}' servicioComida-App) = 'healthy' ]; do sleep 1; done;
      
      sleep 2;
      echo '';
      echo '==================================================================';
      echo '===       REPORTE DE ARRANQUE Y VERIFICACIÓN DE DEPENDENCIAS   ===';
      echo '==================================================================';
      echo '>>> [OK] servicioComida-Postgres inició correctamente.';
      echo '>>> [OK] servicioComida-Keycloak importó el Realm y está listo.';
      echo '>>> [OK] servicioComida-App levantó la ruta /health con éxito.';
      echo '=== ¡TODO EL ECOSISTEMA ESTÁ TOTALMENTE SALUDABLE Y ORDENADO! ===';
      echo '- Ingrese a la app desde su navegador en http://localhost:3000';
      echo '';
      "



volumes:
  postgres_data:
