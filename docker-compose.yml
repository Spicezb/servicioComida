services:
  postgres_db:
    image: postgres:18
    container_name: servicioComida-Postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/inicio.sql:/docker-entrypoint-initdb.d/inicio.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3

  app:
    build: .
    container_name: servicioComida-App

    environment:
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}

    ports:
      - "${APP_HOST_PORT}:${APP_CONTAINER_PORT}"

    depends_on:
      postgres_db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${APP_CONTAINER_PORT}/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: